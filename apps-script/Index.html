function loginPanel(){return '<div class="modal-backdrop"><section class="panel login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title"><button class="modal-close" onclick="closeLogin()" aria-label="ปิด">×</button><span class="eyebrow">WELCOME TO OUR CLASSROOM</span><h2 id="login-title">บัญชีห้องของเรา 🌱</h2>'+(msg?'<p role="alert">'+esc(msg)+'</p>':'')+(demo?'<p>โหมดทดลอง · ไม่ต้องกรอกรหัสผ่านจริง<br>บัญชีทดลองไม่มีข้อมูลส่วนบุคคล</p><label>นักเรียนทดลอง<select id="demo-student">'+students.map(s=>'<option value="'+s.id+'" '+(s.id===selected?'selected':'')+'>เลขที่ '+s.id+'</option>').join('')+'</select></label><button class="primary full" onclick="demoLogin(\'student\')">ทดลองเป็นนักเรียน</button><button class="teacher-login full" onclick="demoLogin(\'teacher\')">ทดลองเป็นคุณครู</button>':teacher||studentSession?'<p>เข้าสู่ระบบแล้ว '+(teacher?'คุณครู':'นักเรียนเลขที่ '+studentSession)+'</p>'+(studentSession?'<form onsubmit="passwordChange(event)"><label>รหัสผ่านปัจจุบัน<input id="old-password" type="password" autocomplete="current-password" required></label><label>รหัสใหม่ อย่างน้อย 6 ตัวอักษร<input id="new-password" type="password" autocomplete="new-password" minlength="6" required></label><button class="primary full" '+(busy?'disabled':'')+'>เปลี่ยนรหัสผ่าน</button></form>':''):'<p>ชื่อผู้ใช้และรหัสผ่านเริ่มต้นของนักเรียน<br>คือเลขประจำตัวนักเรียน</p><form onsubmit="submitLogin(event)"><label>ชื่อผู้ใช้<input id="username" autocomplete="username" required></label><label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label><button class="primary full" '+(busy?'disabled':'')+'>เข้าสู่ระบบ</button></form>')+((teacher||studentSession)?'<button class="text-button full" onclick="logout()">ออกจากระบบ</button>':'')+'</section></div>'}
const dutyGroups=[['จันทร์',[1,5,10,15,20,25,30,35]],['อังคาร',[2,6,11,16,21,26,31,36]],['พุธ',[7,12,17,22,27,32,37]],['พฤหัสบดี',[3,8,13,18,23,28,33]],['ศุกร์',[4,9,14,19,24,29,34]]];
function dutyPage(){const today=new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'Asia/Bangkok'}).format(new Date()),todayIndex=['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(today);return '<section class="panel"><div class="section-heading"><div><span class="eyebrow">OUR WEEKLY TEAM</span><h2>ช่วยกันคนละนิด ห้องเรียนน่าอยู่</h2></div><span class="pill">เวรประจำวัน ป.6/2</span></div><div class="duty-grid">'+dutyGroups.map(([day,ids],i)=>'<article class="duty-card '+(i===todayIndex?'today':'')+'"><h3>วัน'+day+(i===todayIndex?' <span>วันนี้</span>':'')+'</h3><div class="duty-members">'+ids.map(id=>'<div><button onclick="openStudent('+id+')">'+av(students.find(s=>s.id===id)||{id,equipped:{}})+'<b>เลขที่ '+id+'</b></button>'+(teacher?'<div class="duty-buttons"><button onclick="dutyAward('+id+',5)">+5</button><button onclick="dutyAward('+id+',-5)">−5</button></div>':'')+'</div>').join('')+'</div></article>').join('')+'</div></section>'}
async function copyProfile(){const url=new URL(config.publicUrl||location.href);url.search='?student='+selected;url.hash='';try{await navigator.clipboard.writeText(url.href);tell('คัดลอกลิงก์ NFC แล้ว')}catch{prompt('คัดลอกลิงก์นี้ไปเขียนลง NFC',url.href)}}
Object.assign(window,{setTab,openStudent,act,attendance,tryItem,buy,render,exportData,reset,openLogin,closeLogin,demoLogin,submitLogin,logout,passwordChange,copyProfile});
// Expose setters through named handlers; inline HTML never accesses module-scoped variables.
window.selectStudent=id=>{selected=Number(id);preview={};render()};window.cancelPreview=()=>{preview={};render()};
const requested=Number(config.initialStudent||new URLSearchParams(location.search).get('student'));if(requested>=1&&requested<=37){selected=requested;tab='students'}
if(!demo){students=[];$('#app').innerHTML='<section class="workspace"><p>กำลังเชื่อมต่อระบบห้องเรียน…</p></section>';refresh().then(render).catch(e=>{$('#app').innerHTML='<section class="panel" style="margin:30px"><h1>ยังเชื่อมต่อระบบไม่ได้</h1><p>'+esc(e.message)+'</p><p>ข้อมูลจริงไม่ได้ถูกแทนด้วยข้อมูลทดลอง กรุณาลองใหม่ภายหลัง</p><button class="primary" onclick="location.reload()">ลองอีกครั้ง</button></section>'})}else render();
async function importRoster(input){if(!teacher||demo||busy)return;const file=input.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),rows=Array.isArray(raw)?raw:raw.students;if(!Array.isArray(rows)||!rows.length)throw Error('ไฟล์ต้องมีรายการนักเรียน');const unique=new Set();for(const row of rows){if(!Number.isInteger(row.id)||row.id<1||row.id>37||typeof row.name!=='string'||!row.name.trim()||(row.schoolId&&!/^\d+$/.test(String(row.schoolId)))||unique.has(row.id))throw Error('ตรวจเลขที่ ชื่อ เลขประจำตัว และเลขที่ซ้ำในไฟล์');unique.add(row.id)}if(!confirm('นำเข้าหรืออัปเดตรายชื่อนักเรียน '+rows.length+' คน?'))return;await write('importRoster',{students:rows})}catch(e){tell(e.message)}}
function dutyAward(id,amount){if(!teacher)return;const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());if(demo){selected=id;const s=current();s.duty=s.duty||{};const previous=Number(s.duty[date]||0);if(previous===amount)return tell('บันทึกเวรสถานะนี้แล้ว ไม่เพิ่มหรือลดซ้ำ');const meritDelta=amount-previous,coinDelta=Math.max(0,amount)-Math.max(0,previous);if(s.merit+meritDelta<0||s.coins+coinDelta<0)return tell('คะแนนหรือเหรียญทดลองไม่พอแก้ไขสถานะเวร');s.merit+=meritDelta;s.coins+=coinDelta;s.duty[date]=amount;record('เวรประจำวัน '+date,meritDelta);return}write('duty',{studentId:id,amount,date,note:'เวรประจำวัน'})}
Object.assign(window,{importRoster,dutyAward});

function editStudent(action){if(!teacher)return;if(action==='resetStudentPassword'){if(confirm('คืนรหัสผ่านเริ่มต้นเป็นเลขประจำตัวนักเรียน และออกจากระบบนักเรียนทุกเครื่อง?')){if(demo)return tell('โหมดทดลองไม่มีรหัสผ่านจริงให้คืนค่า');write(action)}return}const s=current();if(!s)return;const value=prompt(action==='rename'?'ชื่อนักเรียน':'เลขประจำตัวนักเรียน 3–20 หลัก (เป็นชื่อผู้ใช้และรหัสเริ่มต้น)',action==='rename'?s.name:s.schoolId||'');if(value===null)return;const trimmed=value.trim();if(action==='rename'&&!trimmed)return tell('กรุณาระบุชื่อ');if(action==='setSchoolId'&&!/^\d{3,20}$/.test(trimmed))return tell('เลขประจำตัวต้องเป็นตัวเลข 3–20 หลัก');if(demo){if(action==='rename'){s.name=trimmed;persist();tell('แก้ไขชื่อทดลองแล้ว')}else tell('โหมดทดลองไม่เก็บเลขประจำตัวจริง');return}write(action,action==='rename'?{name:trimmed}:{schoolId:trimmed})}
window.editStudent=editStudent;

function wardrobeControls(){if(!canDress())return '';const s=current();return '<section class="panel"><h3>ตู้เสื้อผ้าของฉัน</h3><div class="button-row">'+[['shirt','ถอดเสื้อแต่งตัว'],['hat','ถอดหมวก'],['accessory','ถอดเครื่องประดับ']].map(([slot,label])=>'<button onclick="unequip(\''+slot+'\')" '+(!s.equipped[slot]?'disabled':'')+'>'+label+'</button>').join('')+'</div>'+ownedItemControls(s)+'</section>'}
function unequip(slot){if(!canDress()||!['shirt','hat','accessory'].includes(slot))return;preview={};if(demo){delete current().equipped[slot];persist();return render()}return write('equip',{itemId:'',slot})}
function personalHistory(){const s=students.find(x=>x.id===studentSession);if(!s)return '<section class="panel">ไม่พบข้อมูลของฉัน</section>';return '<section class="panel"><h2>ประวัติของฉัน · เลขที่ '+s.id+'</h2><p>เงินฝากคงเหลือ '+money(s.savings)+' บาท · คะแนนความดี '+money(s.merit)+' · เหรียญ '+money(s.coins)+'</p><h3>การมาเรียน</h3>'+Object.entries(s.attendance||{}).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,status])=>'<p>'+esc(date)+' · '+esc(({present:'มาเรียน',late:'มาสาย',excused:'ลา',absent:'ขาด'})[status]||status)+'</p>').join('')+'<h3>เวรประจำวัน</h3>'+Object.entries(s.duty||{}).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,value])=>'<p>'+esc(date)+' · '+esc(value)+'</p>').join('')+'<h3>รายการคะแนนและฝากถอน</h3>'+ledger.map(l=>'<p>'+esc(l.time)+' · '+esc(l.type)+' · '+esc(l.note)+'</p>').join('')+'</section>'}
function csvCell(value){let text=String(value??'');if(/^[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}
function csvContent(attendanceOnly=false){const rows=attendanceOnly?[['เลขที่','ชื่อ','วันที่','สถานะ'],...students.flatMap(s=>Object.entries(s.attendance||{}).map(([date,status])=>[s.id,s.name,date,status]))]:[['เลขที่','ชื่อ','เลขประจำตัว','คะแนนความดี','เหรียญ','เงินฝากบาท','NFC URL'],...students.map(s=>{const url=new URL(config.publicUrl||location.href);url.search='?student='+s.id;url.hash='';return [s.id,s.name,s.schoolId||'',s.merit,s.coins,Number(s.savings||0).toFixed(2),url.href]})];return '\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')}
function exportCsv(attendanceOnly=false){if(!teacher)return tell('เข้าสู่ระบบครูก่อน');const url=URL.createObjectURL(new Blob([csvContent(attendanceOnly)],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=attendanceOnly?'classroom-attendance.csv':'classroom-students-nfc.csv';a.click();URL.revokeObjectURL(url)}
Object.assign(window,{unequip,exportCsv});

function bangkokDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}

function attendanceSummary(s){if(!teacher&&studentSession!==s.id)return '';const counts={present:0,late:0,excused:0,absent:0};for(const [date,status] of Object.entries(s.attendance||{}))if(date.startsWith(attendanceMonth)&&status in counts)counts[status]++;return '<section class="action-section"><h3>สรุปการมาเรียนรายเดือน</h3><label>เดือน<input type="month" value="'+attendanceMonth+'" onchange="setAttendanceMonth(this.value)"></label><p>มาเรียน '+counts.present+' · มาสาย '+counts.late+' · ลา '+counts.excused+' · ขาด '+counts.absent+'</p></section>'}
function setAttendanceMonth(value){if(/^\d{4}-\d{2}$/.test(value)){attendanceMonth=value;render()}}
window.setAttendanceMonth=setAttendanceMonth;

function ownedItemControls(s){return '<h4>ของที่เป็นเจ้าของ</h4><div class="button-row">'+catalog.filter(item=>s.owned.includes(item.id)).map(item=>'<button data-item="'+esc(item.id)+'" onclick="buy(this.dataset.item)">'+esc(item.name)+(item.archived?' (เก็บเข้าคลัง)':'')+'</button>').join('')+'</div>'}
function catalogManager(){if(!teacher)return '';const item=catalog.find(x=>x.id===editingCatalogId)||{id:'',name:'',slot:'shirt',price:15,color:'#56cdb0',shape:'shirt',imageUrl:'',archived:false};return '<section class="panel"><h3>จัดการสินค้า · ครู</h3><p>เพิ่มหรือแก้สินค้าได้ เก็บเข้าคลังเพื่อหยุดขายโดยไม่ลบของนักเรียน</p><select onchange="editCatalogItem(this.value)"><option value="">เพิ่มสินค้าใหม่</option>'+catalog.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===editingCatalogId?'selected':'')+'>'+esc(x.name)+(x.archived?' (เก็บเข้าคลัง)':'')+'</option>').join('')+'</select><form onsubmit="saveCatalogItem(event)"><div class="form-row"><label>รหัสสินค้า<input id="item-id" value="'+esc(item.id)+'" pattern="[a-z][a-z0-9-]{1,59}" maxlength="60" required '+(editingCatalogId?'readonly':'')+'></label><label>ชื่อสินค้า<input id="item-name" value="'+esc(item.name)+'" maxlength="80" required></label></div><div class="form-row"><label>หมวดหมู่<select id="item-slot" onchange="setItemSlot(this.value)" '+(editingCatalogId?'disabled':'')+'>'+['shirt','hat','accessory'].map(x=>'<option '+(x===item.slot?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>ราคาเหรียญ<input id="item-price" type="number" min="0" max="100000" step="1" value="'+Number(item.price)+'" required></label><label>สี<input id="item-color" type="color" value="'+esc(item.color)+'"></label></div><label>รูปทรง<select id="item-shape">'+itemShapeOptions(item.slot,item.shape||item.id.split('-')[1])+'</select></label><label>รูปสินค้า URL HTTPS (ไม่จำเป็น)<input id="item-image" type="url" placeholder="https://..." value="'+esc(item.imageUrl||'')+'"></label><label><input id="item-archived" type="checkbox" '+(item.archived?'checked':'')+'> เก็บเข้าคลัง / หยุดขาย</label><button class="primary" '+(busy?'disabled':'')+'>บันทึกสินค้า</button><button type="button" onclick="editCatalogItem(\'\')">เริ่มสินค้าใหม่</button></form></section>'}
function editCatalogItem(id){if(!teacher)return;editingCatalogId=id;render()}
function catalogFormItem(){return {id:$('#item-id').value.trim(),name:$('#item-name').value.trim(),slot:$('#item-slot').value,price:Number($('#item-price').value),color:$('#item-color').value,shape:$('#item-shape').value,imageUrl:$('#item-image').value.trim(),archived:!!$('#item-archived').checked}}
function validCatalogItem(item){if(!/^[a-z][a-z0-9-]{1,59}$/.test(item.id)||!item.name||item.name.length>80||!['shirt','hat','accessory'].includes(item.slot)||!Number.isSafeInteger(item.price)||item.price<0||item.price>100000||!/^#[0-9a-f]{6}$/i.test(item.color)||!itemShapes(item.slot).includes(item.shape))return false;if(item.imageUrl){try{const url=new URL(item.imageUrl);if(url.protocol!=='https:'||url.username||url.password||item.imageUrl.length>2048||!/\.(png|jpe?g|webp)$/i.test(url.pathname))return false}catch{return false}}return true}
async function saveCatalogItem(event){event.preventDefault();if(!teacher||busy)return;const item=catalogFormItem();if(!validCatalogItem(item))return tell('ตรวจรหัส ชื่อ หมวดหมู่ ราคา สี และ URL รูป HTTPS');const existing=catalog.find(x=>x.id===item.id);if(existing&&existing.slot!==item.slot)return tell('สินค้าที่มีอยู่แล้วเปลี่ยนหมวดหมู่ไม่ได้');if(demo){const index=catalog.findIndex(x=>x.id===item.id);catalog=index<0?[...catalog,item]:catalog.map(x=>x.id===item.id?item:x);editingCatalogId=item.id;return tell('บันทึกสินค้าทดลองแล้ว')}editingCatalogId=item.id;return write('upsertItem',{item})}
function reversibleMoneyEntry(entry){return teacher&&!demo&&['deposit','withdraw'].includes(entry.action)&&typeof entry.id==='string'&&Number.isSafeInteger(entry.moneyDeltaSatang)&&entry.moneyDeltaSatang!==0&&!ledger.some(x=>x.reversesEntryId===entry.id)}
function reversalControl(entry){return reversibleMoneyEntry(entry)?'<button class="text-button" data-entry="'+esc(entry.id)+'" onclick="reverseMoney(this.dataset.entry)">คืนรายการเงินผิด</button>':''}
function reverseMoney(entryId){const entry=ledger.find(x=>x.id===entryId);if(!entry||!reversibleMoneyEntry(entry))return;const note=prompt('เหตุผลที่คืนรายการเงินผิด (จำเป็น)');if(note===null)return;if(!note.trim())return tell('กรุณาระบุเหตุผล');if(!confirm('ยืนยันคืนรายการ '+money(Math.abs(entry.moneyDeltaSatang)/100)+' บาท ของเลขที่ '+entry.student+'? ประวัติเดิมจะคงอยู่และคืนได้ครั้งเดียว'))return;return write('reverseMoney',{entryId,studentId:entry.student,note:note.trim()})}
Object.assign(window,{editCatalogItem,saveCatalogItem,reverseMoney});

function itemShapes(slot){return ({shirt:['shirt'],hat:['cap','crown','cat'],accessory:['star','heart','bag','flower']})[slot]||[]}
function itemShapeOptions(slot,selected){return itemShapes(slot).map(shape=>'<option value="'+shape+'" '+(shape===selected?'selected':'')+'>'+shape+'</option>').join('')}
function setItemSlot(slot){$('#item-shape').innerHTML=itemShapeOptions(slot);}
window.setItemSlot=setItemSlot;

})();</script></body></html>
