# Review before applying: starter + persistent disk is a paid configuration.
services:
  - type: web
    name: sl6269-classroom
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USERNAME
        value: krutoey
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: classroom-data
      mountPath: /var/data
      sizeGB: 1
